[project]
name = "forest-fire-detection"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "mlflow>=3.18.0",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "umap-learn>=0.6.0",
]

# PyTorch CUDA (GPU NVIDIA) : index dédié, utilisé uniquement pour torch/torchvision
# (configuration recommandée par la doc uv : docs.astral.sh/uv/guides/integration/pytorch)
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[dependency-groups]
dev = [
    "nbconvert>=7.17.2",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

# ---- Tests unitaires ----
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]          # rend le package src/ importable depuis les tests

# ---- Lint (ruff) ----
[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["notebooks"]   # notebooks non lintés (display() fourni par Jupyter, imports après sys.path)

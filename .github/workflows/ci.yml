# Intégration continue : lint + tests unitaires à chaque push et pull request.
# Actions épinglées par SHA (bonne pratique recommandée par la doc uv : docs.astral.sh/uv/guides/integration/github).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read            # lecture seule du dépôt

jobs:
  lint-and-test:
    name: Lint et tests
    runs-on: ubuntu-latest
    env:
      FFD_REQUIRE_GPU: "0"  # runners GitHub standards sans GPU (cf. src/config.py)

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installer uv (avec cache)
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Installer Python (version de .python-version)
        run: uv python install

      - name: Installer l'environnement (versions figées par uv.lock)
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Tests unitaires (pytest)
        run: uv run pytest
